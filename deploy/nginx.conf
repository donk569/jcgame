# 自建服务器（Nginx）示例：把 dist/ 传到 /var/www/jcgame，然后 include 这段
server {
  listen 80;
  server_name jcgame.example.com;      # 换成你自己的域名
  root /var/www/jcgame;
  index index.html;

  # 前端路由回退：找不到文件就交给 index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 静态资源长缓存（文件名带 hash，可放心长存）
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html 不缓存，保证发版后立刻生效
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
